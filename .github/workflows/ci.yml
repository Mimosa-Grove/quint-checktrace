name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install quint 0.33.1
        run: npm install -g @informalsystems/quint@0.33.1
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
      - name: Install dependencies
        run: opam install . --deps-only --with-test
      - name: Build
        run: opam exec -- dune build
      - name: Install the pinned evaluator
        run: |-
          mkdir -p "$HOME/.quint/rust-evaluator-v0.7.1"
          cp .github/vendor/quint_evaluator-0.7.1-linux-x86_64 \
            "$HOME/.quint/rust-evaluator-v0.7.1/quint_evaluator"
          chmod +x "$HOME/.quint/rust-evaluator-v0.7.1/quint_evaluator"
      - name: Test
        run: opam exec -- dune runtest
