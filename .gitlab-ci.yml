# .gitlab-ci.yml - the repository gate.
# One before_script installs the pinned toolchain (Quint, the OCaml switch,
# the evaluator, the lint and verification tools); the jobs run the
# repository's own gates. The OCaml switch is cached across runs.
stages:
  - test

variables:
  QUINT_VERSION: "0.33.1"
  OCAML_VERSION: "5.3.0"
  DUNE_VERSION: "3.17.2"
  OCAMLFORMAT_VERSION: "0.29.0"
  ZANUDA_VERSION: "2.0.0"
  QUINT_AUDIT_PIN: "git+https://github.com/Mimosa-Grove/quint-audit.git#c676e36"
  OPAMROOT: "$CI_PROJECT_DIR/.ci-deps/opam"

cache:
  key: opam-$OCAML_VERSION-$DUNE_VERSION
  paths:
    - .ci-deps/opam

default:
  image: node:20-bookworm
  timeout: 60m
  before_script:
    # Row: the runner clones as root; git otherwise refuses the checkout for
    # a job user with a different ownership.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl git jq
      build-essential diffutils opam m4 pkg-config rsync unzip bubblewrap
    # Apalache, the bounded model checker behind `quint verify`, is a JVM
    # application: Apalache 0.62.4 is compiled for Java 21 (class file 65)
    # and Debian bookworm ships 17, so the JDK comes from the Adoptium
    # repository. Assert the major version after install.
    - apt-get install -y -qq --no-install-recommends gpg ca-certificates
    - curl -fsSL 'https://packages.adoptium.net/artifactory/api/gpg/key/public' | gpg --dearmor -o /etc/apt/trusted.gpg.d/adoptium.gpg
    - echo "deb https://packages.adoptium.net/artifactory/deb bookworm main" > /etc/apt/sources.list.d/adoptium.list
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends temurin-21-jre
    - java -version 2>&1 | grep -q 'version "21\.'
    # Quint toolchain and the version assertion.
    - npm install -g "@informalsystems/quint@${QUINT_VERSION}"
    - test "$(quint --version)" = "$QUINT_VERSION"
    # OCaml toolchain: a cached switch at the pinned compiler, with the dune
    # version and the libraries the suite links, the formatting tool, the
    # lint tool and the specification linter.
    - |
      if [ ! -d "$OPAMROOT/$OCAML_VERSION" ]; then
        opam init --disable-sandboxing --bare --no-setup --yes
        opam switch create "$OCAML_VERSION" --yes
      fi
    - eval "$(opam env --switch="$OCAML_VERSION" --set-switch)"
    - opam pin add --yes quint-audit "$QUINT_AUDIT_PIN"
    - opam install --yes "dune.$DUNE_VERSION" cmdliner alcotest qcheck
      "ocamlformat.$OCAMLFORMAT_VERSION" "zanuda.$ZANUDA_VERSION"
      quint-audit
    - test "$(dune --version)" = "$DUNE_VERSION"
    - test "$(ocamlformat --version)" = "$OCAMLFORMAT_VERSION"
    - test "$(ocamlopt -version)" = "$OCAML_VERSION"
    - zanuda -version
    # Evaluator provisioning: the pinned Quint fetches the Rust evaluator on
    # first use; the digest is asserted against the shipped table before any
    # gate runs. The probe line is a block scalar: its text contains a
    # colon-space, which a plain scalar would turn into a yaml mapping
    # and GitLab would reject at pipeline creation.
    - |
      mkdir -p .ci-probe && printf 'module Tiny {\n  var count: int\n  action init = count'"'"' = 0\n  action step = count'"'"' = count + 1\n  val nonNegative = count >= 0\n}\n' > .ci-probe/tiny.qnt
    - cd .ci-probe && quint run tiny.qnt --main=Tiny --backend=rust --max-samples=1 --max-steps=2 --seed=0x1 --invariant=nonNegative --out-itf=tiny.itf.json && cd "$CI_PROJECT_DIR"
    - |
      expected=$(jq -r '.pins[] | select(.platform=="linux-x86_64") | .sha256' bin/evaluator-digests.json)
      actual=$(sha256sum "$HOME/.quint/rust-evaluator-v0.7.1/quint_evaluator" | cut -d' ' -f1)
      if [ "$actual" != "$expected" ]; then
        echo "evaluator digest mismatch: expected $expected, got $actual"
        exit 1
      fi
    # Toolchain audit: every binary a job below invokes must be on PATH. The
    # image supplies the shell utilities; the installs above supply the rest.
    # A missing tool fails here, before a job fails obscurely.
    - |
      missing=0
      for tool in basename cp cut diff find gcc git grep head jq m4 make \
                  mktemp node npm ocamlopt ocamlformat opam pkg-config \
                  printf quint quint-audit rsync sha256sum setsid sort tail \
                  timeout unzip zanuda java; do
        if ! command -v "$tool" >/dev/null 2>&1; then
          echo "toolchain: $tool is missing"; missing=1
        fi
      done
      [ "$missing" = 0 ] && echo "toolchain: every invoked binary is present"

gate:
  stage: test
  script:
    # The repository's own entry point: dune build, fixture regeneration
    # byte-identity, Quint parse over the fixture specifications, and the
    # test suite (which replays the corpus gate registry).
    - ./run_tests.sh
    # Gate-mode smoke beside the suite: the committed registry must agree on
    # every triple and print its counts and end marker.
    - |
      eval "$(opam env --switch="$OCAML_VERSION" --set-switch)"
      _build/default/bin/main.exe --gate test/corpus/corpus \
        test/corpus/manifest.json test/corpus/hand-verified

fmt:
  stage: test
  script:
    - eval "$(opam env --switch="$OCAML_VERSION" --set-switch)"
    - dune build @fmt

lint:
  stage: test
  script:
    - eval "$(opam env --switch="$OCAML_VERSION" --set-switch)"
    - zanuda -dir .

spec-lint:
  stage: test
  script:
    - |
      set -e
      # The specification lint baseline: every scoped .qnt must exit its
      # recorded code. The non-zero rows are quint-audit-side limitations
      # recorded in fixtures/README.md (the instance-qualified-invariant
      # false positive and the integer-literal range refusal) and the three
      # intentional synthetic regression specs.
      expected_rc() {
        case "$1" in
          fixtures/two-instance.qnt) echo 1;;
          fixtures/bigint-i64-max.qnt|fixtures/bigint-i64-max-bigint.qnt|\
          fixtures/bigint-i64-min.qnt|fixtures/bigint-i64-min-bigint.qnt|\
          fixtures/hand-verified/hand-bigint.qnt) echo 2;;
          test/corpus/hand-verified/hand-bigint.qnt) echo 2;;
          test/regressions/record-values/recvalue.qnt|\
          test/regressions/record-values/recvalue-list.qnt|\
          test/regressions/record-values/recvalue-variant.qnt) echo 1;;
          *) echo 0;;
        esac
      }
      fail=0
      for f in $(find fixtures test/corpus/hand-verified test/regressions -name '*.qnt' | sort); do
        [ "$(basename "$f")" = "spec.qnt" ] && continue
        rc=0
        quint-audit lint "$f" >/dev/null 2>&1 || rc=$?
        want=$(expected_rc "$f")
        if [ "$rc" != "$want" ]; then
          echo "lint: $f exited $rc, expected $want"
          fail=1
        fi
      done
      [ "$fail" = 0 ] && echo "spec lint: scoped set clean against the baseline"

spec-verify:
  stage: test
  # Per-shard budget. Four matrix jobs run in parallel, one JVM per runner
  # (-P 1 inside the shard). The budget covers the measured worst case of
  # one shard with margin: the heaviest recorded shard holds one heap-out
  # run (mutantEq, 319 s measured at the pinned 4096 MB heap) and a
  # violation class at about 58 s, so 13 runs at that mix come to about
  # 1100 s - 2.4 times inside the 45-minute wall.
  timeout: 45m
  # RAM pin. The packaged apalache-mc launcher sets a 4 GB JVM heap
  # (-Xmx4096m) unless JVM_ARGS carries a heap flag; the job exports the
  # same value itself (see the script comment), so the recorded heap-out
  # verdicts are asserted against a pinned heap, not a launcher default.
  # The two recorded heap-out verdicts need the JVM to exhaust that heap
  # and print "Ran out of heap memory". Under memory pressure the OS kills
  # the process instead, and the verdict reads no-verdict. The tag
  # pipeline reproduced that failure on the default small runner (2 vCPU /
  # 8 GB); the medium runner (4 vCPU / 16 GB) is the next class and gives
  # the 4 GB heap and Z3 headroom. Both runner shapes are from the GitLab
  # hosted-runner documentation.
  tags:
    - saas-linux-medium-amd64
  # Four shards, one GitLab job each: every shard owns its own job-timeout
  # budget, so the pipeline no longer depends on one job finishing 55
  # bounded verifies under a single 90-minute wall.
  parallel:
    matrix:
      - SHARD: ["0", "1", "2", "3"]
  # Tiered (2026-11-18): the bounded verifies are the slowest gate in
  # the pipeline (55 model-checking runs), so they do not run on every
  # push. They run unconditionally on release tags, on nightly
  # schedules, and on demand; the push pipeline stays fast, and the
  # recorded verdicts still reproduce at every point that matters -
  # a release tag is exactly such a point. The nightly schedule is
  # created once in the GitLab UI (CI/CD - Schedules, nightly, main).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'
    - when: manual
      allow_failure: true
  script:
    - |
      set -e
      # Bounded verification over the corpus gate's derive triples: the
      # same (path, main, invariant) set the registry replays, at
      # max-steps=3. The expected verdict of every run is recorded here:
      # most invariants verify clean; a recorded set is falsifiable at the
      # bound (the corpus is byte-pinned evidence, and a counterexample
      # found in it is a fact about the spec's source, not a repository
      # defect); vizIR exceeds the model checker's heap on both its
      # invariants (a recorded limitation of that specification's size).
      # A run that deviates from its recorded verdict is a red pipeline:
      # the verification verdicts must reproduce.
      #
      # Capture (2026-11-18): every run writes its output to a FILE and the
      # file is classified. A command substitution around the run
      # (out=$(timeout ... quint verify)) keeps the shell blocked on the
      # pipe for as long as ANY process holds the write end: Quint hands
      # the job's stdout to the Apalache JVM, a JVM that outlives the TERM
      # keeps $( ) waiting, and the run cap then bounds the signal, not the
      # wall. A file cannot block, so the cap is the wall again.
      #
      # Reap (2026-11-18): each run starts in its own session (setsid), so
      # the deadline can signal the whole tree, and the group is killed once
      # more after the direct child returns. Probed locally: with
      # timeout --kill-after alone, a TERM-ignoring grandchild survived (the
      # direct child died on TERM and timeout returned without escalating).
      # Escalation here is TERM at the cap, KILL 30 s later. The cap is
      # 900 s: 2.8 times the measured heap-out run (mutantEq, 319 s at the
      # pinned heap), and the escalation keeps a run that reaches it from
      # outliving its own wall.
      #
      # Heap (2026-11-18, the recorded expectation is pinned): the heap is
      # set here, at the value the packaged launcher defaults to, so the
      # heap-out rows are asserted against a 4096 MB heap deterministically
      # instead of a launcher default that can drift. Apalache honours
      # JVM_ARGS; Quint passes the environment through and has no heap flag
      # of its own.
      export JVM_ARGS=-Xmx4096m
      command -v setsid >/dev/null 2>&1 || { echo "spec verify: setsid is missing"; exit 1; }
      expect() {
        case "$1/$2" in
          catalogue-partb/cataloguePresenceIsInert|\
          catalogue-record/cataloguePresenceIsInert|\
          scope-model/cataloguePresenceIsInert|\
          alias_commands/uniqueNames|\
          configuration/markdownLocationValid|\
          conflict_resolution/conflictResolutionValid|\
          default_values/statusValid|\
          interactive_mode/historyMatchesResponses|\
          task_archiving/noTaskInBoth|\
          task_attributes/ratingsInRange|\
          task_counts/nonNegativeCount|\
          task_management/idsNotEmpty|\
          undo_functionality/idsNotEmpty|\
          version-drift/inv)
            echo violation ;;
          ir/p2|ir/mutantEq)
            echo heap-out ;;
          *) echo ok ;;
        esac
      }
      # classify sets `class` from the run's log FILE; the output is never
      # held in a variable.
      classify() {
        class=no-verdict
        if grep -q 'Ran out of heap memory' "$1"; then class=heap-out
        elif grep -q '\[violation\] Found an issue' "$1"; then class=violation
        elif grep -q '\[ok\] No violation found' "$1"; then class=ok
        fi
      }
      verify_one() {
        path="$1"; main="$2"; inv="$3"
        base=$(basename "$path" .qnt)
        want=$(expect "$base" "$inv")
        run_once() {
          run_log="$CI_PROJECT_DIR/verify-$shard-$base-$inv.log"
          setsid quint verify "$path" --main="$main" --invariant="$inv" \
            --max-steps=3 > "$run_log" 2>&1 &
          run_pid=$!
          (
            sleep 900
            kill -TERM -- "-$run_pid" 2>/dev/null
            sleep 30
            kill -KILL -- "-$run_pid" 2>/dev/null
          ) &
          watchdog=$!
          last_rc=0
          wait "$run_pid" || last_rc=$?
          kill "$watchdog" 2>/dev/null || true
          # a process that ignored TERM is still in the run's session:
          # reap it before the next triple starts
          kill -KILL -- "-$run_pid" 2>/dev/null || true
          classify "$run_log"
        }
        run_once
        got=$class
        # the recorded transient: one no-verdict re-ran stable - retry
        # once, and only for a run that ended on its own. A run the
        # deadline killed (TERM 143, KILL 137, timeout 124) is a wall, not
        # a transient, and retrying it doubles the wall.
        if [ "$got" = "no-verdict" ] && [ "$want" != "no-verdict" ] &&
           [ "$last_rc" -ne 124 ] && [ "$last_rc" -ne 137 ] && [ "$last_rc" -ne 143 ]; then
          run_once
          got=$class
        fi
        if [ "$got" != "$want" ]; then
          echo "verify: $path (main $main) invariant $inv: expected $want, got $got (exit $last_rc)"
          echo "$path $inv" >> "$CI_PROJECT_DIR/verify-failures-$shard.txt"
        else
          echo "verify: $inv [$got] as recorded"
        fi
      }
      shard="${SHARD:?the shard matrix variable is unset}"
      shard_total=4
      case "$shard" in
        0|1|2|3) ;;
        *) echo "spec verify: bad shard index $shard"; exit 1 ;;
      esac
      if [ -n "${CI_NODE_INDEX:-}" ] && [ "$CI_NODE_INDEX" -ne $((shard + 1)) ]; then
        echo "spec verify: matrix shard $shard does not match CI_NODE_INDEX $CI_NODE_INDEX"
        exit 1
      fi
      cd test/corpus/corpus
      rm -f "$CI_PROJECT_DIR/verify-failures-$shard.txt"
      # Shard by position in the triple list: shard s takes indices
      # s, s+4, s+8, ... The list is the same manifest order the recorded
      # verdicts were produced from. One run at a time: two JVMs on one
      # runner doubled wall time and starved both heaps.
      jq -r '.[] | select(.main != null) | . as $r | .invariants[] | [$r.path, $r.main, .name] | @tsv' ../manifest.json > "$CI_PROJECT_DIR/spec-triples-$shard.tsv"
      mapfile -t triples < "$CI_PROJECT_DIR/spec-triples-$shard.tsv"
      total=${#triples[@]}
      if [ "$total" -eq 0 ]; then
        echo "spec verify: the manifest produced no derive triples"
        exit 1
      fi
      ran=0
      for ((i=shard; i<total; i+=shard_total)); do
        IFS=$'\t' read -r path main inv <<< "${triples[$i]}"
        verify_one "$path" "$main" "$inv"
        ran=$((ran + 1))
      done
      echo "spec verify: shard $shard ran $ran of $total triples"
      if [ "$ran" -eq 0 ]; then
        echo "spec verify: shard $shard ran no triples"
        exit 1
      fi
      if [ -f "$CI_PROJECT_DIR/verify-failures-$shard.txt" ]; then
        echo "spec verify: FAILED triples in shard $shard:"
        cat "$CI_PROJECT_DIR/verify-failures-$shard.txt"
        exit 1
      fi
      echo "spec verify: shard $shard reproduced every recorded verdict"
